# @package _group_
#
# Soft cross-attention AV-HuBERT (LOOKAHEAD-4, ~240ms latency):
#   noisy audio + clean video → clean Mimi semantic tokens
#
# Difference from crossattn_noisy: uses soft weighted-sum over Mimi codebook
# embeddings (softmax(noisy_logits) @ embed.weight) instead of hard argmax
# token lookup. Propagates acoustic uncertainty into visual fusion.
#
# Requires NOISY_LOGITS_ROOT env var pointing to pre-extracted .npy logits.
# Optional KD: set TEACHER_LOGITS_ROOT to dir of {utt_id}.npy teacher logits
#   (from a lookahead>0 teacher) and set criterion.lambda_kd > 0.

common:
  fp16: true
  log_format: json
  log_interval: 100
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???

checkpoint:
  save_interval: 1
  save_interval_updates: 5000
  keep_interval_updates: 1
  no_epoch_checkpoints: false
  best_checkpoint_metric: loss
  maximize_best_checkpoint_metric: false

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 1
  distributed_port: 29676
  nprocs_per_node: 1

task:
  _name: av_hubert_pretraining
  data: ???
  label_dir: ???
  labels: ["mimi"]

  label_rate: 25
  fine_tuning: true
  single_target: false
  is_s2s: false

  normalize: true
  stack_order_audio: 4
  max_sample_size: 500

  modalities: ["audio", "video"]

  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 6
  max_tokens: 1000
  validate_after_updates: 0
  validate_interval: 1
  validate_interval_updates: 5000
  train_subset: train
  valid_subset: valid

criterion:
  _name: mimi_mix_loss
  d_model: 1024
  lambda_pred_coding: 0.0   # 0.0 = disabled; set to e.g. 0.1 to enable
  lambda_kd: 0.0            # KL-div KD from lookahead>0 teacher; 0.0 = disabled
  kd_temperature: 2.0       # softening temperature for KD

optimization:
  max_epoch: 6
  max_update: 1000000
  lr: [0.0001]
  sentence_avg: false
  update_freq: [1]
  clip_norm: 5.0

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08
  weight_decay: 0.0

lr_scheduler:
  _name: tri_stage
  warmup_steps: 1000
  hold_steps: 0
  decay_steps: 35000
  final_lr_scale: 0.05

model:
  _name: av_hubert_crossattn_soft
  w2v_path: /mnt/hard1/bella/EMNLP26/model_weight/large_vox_iter5.pt
  mimi_vocab_size: 2048
  head_hidden_dim: 0

  # ── backbone causal settings ──────────────────────────────────────────────
  lookahead_frames: 4

  # ── soft cross-attention fuser ────────────────────────────────────────────
  token_embed_dim: 256
  cross_attn_heads: 4
  cross_attn_dropout: 0.1
  cross_attn_lookahead: 4
  logit_temperature: 1.0      # 1.0 = standard softmax; lower = sharper

  # ── prefix tuning ─────────────────────────────────────────────────────────
  # K vectors prepended to cross-attn key/value; all queries attend freely
  # conditioned on spk_emb if speaker_cond != none, else shared learned prefix
  prefix_length: 0  # 0 = disabled; try 4, 8, 16

  # ── speaker conditioning ───────────────────────────────────────────────────
  # Options: none | pretrained_spk
  # pretrained_spk: set ARCFACE_EMBED_ROOT to dir of {utt_id}.npy ArcFace embeddings
  speaker_cond: None
  speaker_embed_dim: 256
  pretrained_spk_dim: 512

  pred_coding_k: 0      # 0 = disabled; >0 = predict next k frames at 12.5 Hz

  normalize: true

  # ── regularisation ────────────────────────────────────────────────────────
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5

  layerdrop: 0.1
  dropout: 0.1
  activation_dropout: 0.1
  attention_dropout: 0.1
  feature_grad_mult: 1.0
  freeze_finetune_updates: 0

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
