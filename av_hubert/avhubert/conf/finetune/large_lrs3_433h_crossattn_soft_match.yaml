# @package _group_
#
# Soft cross-attention AV-HuBERT + target-speaker matching loss:
#   noisy audio + clean video → clean Mimi semantic tokens
#
# Adds L_match on top of the denoising CE loss:
#   L = L_Den + λ * L_match
#
# L_match is a symmetric InfoNCE loss that pulls the pooled AV-HuBERT speech
# representation toward its paired ArcFace face embedding and pushes it away
# from other speakers in the batch.  This encourages the model to recover
# content associated with the visible speaker rather than interfering speech.
#
# Required environment variables:
#   NOISY_LOGITS_ROOT   — dir of {utt_id}.npy noisy Mimi logit files
#   ARCFACE_EMBED_ROOT  — dir of {utt_id}.npy ArcFace face embedding files
#
# Optional:
#   TEACHER_LOGITS_ROOT — dir of {utt_id}.npy teacher logits (set lambda_kd > 0)

common:
  fp16: true
  log_format: json
  log_interval: 100
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???

checkpoint:
  save_interval: 1
  save_interval_updates: 5000
  keep_interval_updates: 1
  no_epoch_checkpoints: false
  best_checkpoint_metric: loss
  maximize_best_checkpoint_metric: false

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 1
  distributed_port: 29676
  nprocs_per_node: 1

task:
  _name: av_hubert_pretraining
  data: ???
  label_dir: ???
  labels: ["mimi"]

  label_rate: 25
  fine_tuning: true
  single_target: false
  is_s2s: false

  normalize: true
  stack_order_audio: 4
  max_sample_size: 500

  modalities: ["audio", "video"]

  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 6
  max_tokens: 1000
  validate_after_updates: 0
  validate_interval: 1
  validate_interval_updates: 5000
  train_subset: train
  valid_subset: valid

criterion:
  _name: mimi_mix_loss
  d_model: 1024
  lambda_pred_coding: 0.0
  lambda_kd: 0.0
  kd_temperature: 2.0

  # ── target-speaker matching loss ─────────────────────────────────────────
  use_speaker_match: true
  lambda_match: 0.1          # λ in Eq. (2): L = L_Den + λ * L_match
  match_proj_dim: 256        # shared audio/visual projection dimension
  match_spk_dim: 512         # ArcFace output dimension (InsightFace default)
  match_temperature: 0.07    # InfoNCE temperature; lower = harder negatives

optimization:
  max_epoch: 6
  max_update: 1000000
  lr: [0.0001]
  sentence_avg: false
  update_freq: [1]
  clip_norm: 5.0

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08
  weight_decay: 0.0

lr_scheduler:
  _name: tri_stage
  warmup_steps: 4000
  hold_steps: 0
  decay_steps: 35000
  final_lr_scale: 0.05

model:
  _name: av_hubert_crossattn_soft
  w2v_path: /mnt/hard1/bella/EMNLP26/model_weight/large_vox_iter5.pt
  mimi_vocab_size: 2048
  head_hidden_dim: 0

  lookahead_frames: 0

  token_embed_dim: 256
  cross_attn_heads: 4
  cross_attn_dropout: 0.1
  cross_attn_lookahead: 0
  logit_temperature: 1.0

  prefix_length: 0

  # speaker_cond must be pretrained_spk so ARCFACE_EMBED_ROOT embeddings are
  # loaded into net_input["speaker_embed"] — required for L_match
  speaker_cond: pretrained_spk
  speaker_embed_dim: 256
  pretrained_spk_dim: 512

  pred_coding_k: 0

  normalize: true

  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5

  layerdrop: 0.1
  dropout: 0.1
  activation_dropout: 0.1
  attention_dropout: 0.1
  feature_grad_mult: 1.0
  freeze_finetune_updates: 0

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
