# @package _group_
#
# Soft cross-attention AV-HuBERT + frozen AV sync predictor loss:
#   noisy audio + clean video → clean Mimi semantic tokens
#
# Training objective (Eq. 2 of the paper):
#   L = L_Den + λ_sync · L_sync
#
# L_sync is computed by a frozen AVSyncPredictor that scores, frame by frame,
# how well the model's token logit distribution aligns with the target
# speaker's lip movements.  Gradient flows through the soft codebook bridge:
#
#   logits_12p5 [B,T,V]
#     → softmax(· / T) @ token_embed.weight   [B,T,C]  ← bridge (no new params)
#     → frozen cross-attention encoder
#     → cosine_sim vs. visual-only features   [B,T]
#     → L_sync = 1 − mean(frame_sync[valid])
#
# Required environment variables:
#   NOISY_LOGITS_ROOT   — dir of {utt_id}.npy noisy Mimi logit files
#   VISUAL_FEATS_ROOT   — dir of {utt_id}.npy visual-only features at 12.5 Hz
#                         (extract with: process_dataset/extract_visual_features.py)
#   AV_SYNC_CKPT        — path to pre-trained AVSyncPredictor checkpoint
#                         (train with: python scripts/train_av_sync.py)
#
# Two-phase training recipe:
#   Phase 1 — pre-train the sync predictor on clean LRS3:
#     python scripts/train_av_sync.py \
#         --tsv /data/lrs3/train.tsv \
#         --output_dir /ckpts/sync \
#         --epochs 20 --batch_size 32
#
#   Phase 2 — fine-tune the enhancement model with this config:
#     export NOISY_LOGITS_ROOT=...
#     export VISUAL_FEATS_ROOT=...
#     export AV_SYNC_CKPT=/ckpts/sync/best.pt
#     fairseq-hydra-train --config-dir ... --config-name large_lrs3_433h_crossattn_soft_avsync ...

common:
  fp16: true
  log_format: json
  log_interval: 100
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???

checkpoint:
  save_interval: 1
  save_interval_updates: 5000
  keep_interval_updates: 1
  no_epoch_checkpoints: false
  best_checkpoint_metric: loss
  maximize_best_checkpoint_metric: false

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 1
  distributed_port: 29676
  nprocs_per_node: 1

task:
  _name: av_hubert_pretraining
  data: ???
  label_dir: ???
  labels: ["mimi"]

  label_rate: 25
  fine_tuning: true
  single_target: false
  is_s2s: false

  normalize: true
  stack_order_audio: 4
  max_sample_size: 500

  modalities: ["audio", "video"]

  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 6
  max_tokens: 5000
  validate_after_updates: 0
  validate_interval: 1
  validate_interval_updates: 5000
  train_subset: train
  valid_subset: valid

criterion:
  _name: mimi_mix_loss
  d_model: 1024
  lambda_pred_coding: 0.0
  lambda_kd: 0.0
  kd_temperature: 2.0

  # ── AV sync predictor loss (L_sync) ───────────────────────────────────────
  use_av_sync: true
  lambda_sync: 0.1             # weight for L_sync in the total objective
  sync_logit_temperature: 1.0  # softmax temperature for soft codebook bridge
                               # 1.0 = standard; lower = harder (more like hard token)

optimization:
  max_epoch: 6
  max_update: 1000000
  lr: [0.0001]
  sentence_avg: false
  update_freq: [1]
  clip_norm: 5.0

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08
  weight_decay: 0.0

lr_scheduler:
  _name: tri_stage
  warmup_steps: 4000
  hold_steps: 0
  decay_steps: 35000
  final_lr_scale: 0.05

model:
  _name: av_hubert_crossattn_soft
  w2v_path: /mnt/hard1/bella/EMNLP26/model_weight/large_vox_iter5.pt
  mimi_vocab_size: 2048
  head_hidden_dim: 0

  lookahead_frames: 4

  token_embed_dim: 256
  cross_attn_heads: 4
  cross_attn_dropout: 0.1
  cross_attn_lookahead: 4
  logit_temperature: 1.0

  prefix_length: 0

  speaker_cond: None
  speaker_embed_dim: 256
  pretrained_spk_dim: 512

  pred_coding_k: 0

  normalize: true

  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5

  layerdrop: 0.1
  dropout: 0.1
  activation_dropout: 0.1
  attention_dropout: 0.1
  feature_grad_mult: 1.0
  freeze_finetune_updates: 0

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
